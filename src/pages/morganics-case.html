<main class="case glide-case morganics-case" id="top" style="--project:{{accent}}">
<a class="back" href="/#work">← BACK HOME</a>
<header class="case-header"><h1>{{title}}</h1><div class="case-meta"><p class="case-deck">{{deck}}</p><dl><dt>CLIENT</dt><dd>{{client}}</dd></dl><dl><dt>SERVICES</dt><dd>{{services}}</dd></dl><dl><dt>TYPE</dt><dd>{{category}}</dd></dl></div></header>
{{top_carousel}}
<section class="case-introduction editorial-block"><h2>THE PROJECT</h2><p>{{intro}}</p></section>
{{chapter_index}}
{{chapter_gallery}}
<section class="editorial-block case-deliverables"><h2>THE COMPLETE SYSTEM</h2>{{deliverables}}</section>
<section class="next-case"><span class="eyebrow">NEXT PROJECT</span><a href="/{{next_slug}}/"><h2>{{next_title}}</h2><span>↗</span></a></section>
</main>
<dialog class="lightbox" aria-label="Project image viewer"><button class="close" aria-label="Close image">CLOSE {{close_icon}}</button><img alt=""><p></p></dialog>
