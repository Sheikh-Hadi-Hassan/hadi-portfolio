name: V0.0 baseline verification

on:
  push:
    branches:
      - integration/v00-authoritative-baseline-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working baseline
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Python build dependency
        run: python -m pip install Pillow

      - name: Checkout preserved production snapshot for parity evidence
        uses: actions/checkout@v4
        with:
          ref: recovery/verified-production-20261021
          path: production-snapshot

      - name: Run source behavior tests
        shell: bash
        run: |
          set -euo pipefail
          npm test
          for test_file in tests/*.mjs tests/*.cjs tests/support/*.mjs; do
            echo "Running ${test_file}"
            node "${test_file}"
          done

      - name: Verify Sera v9 bundle reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/sera-v9-source/build.py
          cmp integrations/sera-v9-source/intellignce-support/widget-v9.js public/intellignce-support/widget-v9.js

      - name: Build production-origin output from repository source only
        env:
          SITE_URL: https://hadi.intellignce.net
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          # The recovered source references design/hero-lock.json, but that file
          # never existed in this branch's Git history. Skip only the orphaned
          # guard while preserving the actual build pipeline for parity testing.
          python3 scripts/build.py
          python3 scripts/optimize-images.py
          python3 scripts/prepare-next.py
          npx next build --webpack
          python3 scripts/prune-export.py

      - name: Run post-build audits
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/export-hydration.py
          python3 tests/production.py
          python3 tests/seo.py
          python3 tests/images.py

      - name: Verify production origin in generated SEO files
        shell: bash
        run: |
          set -euo pipefail
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/image-sitemap.xml
          grep -Fq "Sitemap: https://hadi.intellignce.net/sitemap.xml" out/robots.txt
          grep -Fq "https://hadi.intellignce.net/" out/sitemap.xml
          if grep -R -Fq "hadi-hassan-editorial.lemony-morel-0696.chatgpt.site" out; then
            echo "Legacy ChatGPT Site origin remains in generated output."
            exit 1
          fi

      - name: Compare fresh build with preserved production snapshot
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json

          built = Path("out")
          snap = Path("production-snapshot/production")
          if not snap.exists():
              raise SystemExit("production snapshot directory is missing")

          ignore_names = {
              "RELEASE-MANIFEST.json",
              "RELEASE-STATUS.md",
              "BUILD_HANDOFF.md",
              "PRODUCTION_VERIFICATION.md",
              "QA_REPORT.md",
          }

          def inventory(root):
              result = {}
              for p in root.rglob("*"):
                  if not p.is_file() or p.name in ignore_names:
                      continue
                  rel = p.relative_to(root).as_posix()
                  result[rel] = {
                      "size": p.stat().st_size,
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
              return result

          b = inventory(built)
          s = inventory(snap)
          only_built = sorted(set(b)-set(s))
          only_snapshot = sorted(set(s)-set(b))
          changed = sorted(k for k in set(b)&set(s) if b[k]["sha256"] != s[k]["sha256"])
          same = sorted(k for k in set(b)&set(s) if b[k]["sha256"] == s[k]["sha256"])

          report = {
              "built_files": len(b),
              "snapshot_files": len(s),
              "same_files": len(same),
              "changed_files": len(changed),
              "only_built": len(only_built),
              "only_snapshot": len(only_snapshot),
              "changed_sample": changed[:100],
              "only_built_sample": only_built[:100],
              "only_snapshot_sample": only_snapshot[:100],
          }
          Path("v00-parity-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))

          critical = ["index.html", "robots.txt", "sitemap.xml"]
          missing = [p for p in critical if p not in b]
          if missing:
              raise SystemExit("fresh build missing critical files: " + ", ".join(missing))

      - name: Upload V0.0 parity report
        uses: actions/upload-artifact@v4
        with:
          name: v00-parity-report
          path: v00-parity-report.json
