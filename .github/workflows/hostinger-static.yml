name: Hostinger static release
on:
  workflow_dispatch:
  push:
    branches:
      - review/navigation-resume-archive-20261102
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static website for shared hosting
        env:
          HOSTINGER_STATIC_EXPORT: '1'
          NEXT_PUBLIC_SITE_URL: https://hadi.intellignce.net
        run: npx next build
      - name: Validate export files and key routes
        run: |
          test -s out/index.html
          test -s out/work/index.html
          test -s out/archive/index.html
          test -s out/resume/index.html
          test -s out/contact/index.html
          test -s out/sitemap.xml
          test -s out/robots.txt
          test -s out/llms.txt
          if grep -R -l 'lbertoomenick4981.chatgpt.site' out --include='*.html' --include='*.xml' --include='*.txt'; then
            echo 'Legacy production URL found in export' >&2
            exit 1
          fi
      - name: Hostinger archive (contents go in public_html)
        run: |
          cd out
          zip -qr ../hadi-hostinger-static.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: hadi-hostinger-static
          path: hadi-hostinger-static.zip
          if-no-files-found: error
          retention-days: 30
