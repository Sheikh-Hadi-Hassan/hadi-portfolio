name: Expertise Portfolio Quality
on:
  pull_request:
    paths:
      - 'scripts/optimize-images.py'
      - 'public/assets/expertise/**'
      - 'scripts/product_portfolio.py'
      - 'src/styles/product-portfolio.css'
      - 'scripts/product_flight.py'
      - 'src/product-flight.js'
      - 'src/product-onlines.js'
      - 'src/styles/product-onlines.css'
      - 'tests/product-onlines-browser.cjs'
      - 'tests/product-onlines-visual.cjs'
      - 'src/product-components.js'
      - 'src/styles/product-components.css'
      - 'tests/product-components-browser.cjs'
      - 'src/styles/product-flight.css'
      - 'src/data/product-flight.json'
      - 'tests/product-flight-browser.cjs'
      - 'scripts/expertise.py'
      - 'scripts/build.py'
      - 'src/data/expertise.json'
      - 'src/data/seo-pages.json'
      - 'src/site.js'
      - 'src/styles/expertise.css'
      - 'src/styles/footer.css'
      - 'src/footer-runtime.js'
      - 'src/footer-static.js'
      - 'src/app/footer-motion.jsx'
      - 'src/components/head.html'
      - 'tests/footer-controls.cjs'
      - 'tests/footer-static-parity.cjs'
      - 'src/components/navigation.html'
      - 'tests/expertise.py'
      - 'tests/expertise-browser.cjs'
      - 'tests/phone_stack.py'
      - 'tests/phone-stack-browser.cjs'
      - 'src/data/mobile-screen-stacks.json'
      - '.github/workflows/expertise-quality.yml'
  push:
    branches:
      - feature/expertise-portfolios-20261113
  workflow_dispatch:

concurrency:
  group: expertise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expertise-validation:
    if: github.event_name != 'pull_request' || !contains(fromJSON('["ci/p0-03d-canonical-home-export-20261122","ci/p0-03e-canonical-home-browser-20261123"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pillow
          npm ci --no-audit --no-fund
      - name: Validate project taxonomy and static generator syntax
        run: |
          python -m py_compile scripts/build.py scripts/expertise.py scripts/product_flight.py scripts/product_portfolio.py scripts/prepare-next.py tests/expertise.py tests/phone_stack.py
          node --check src/site.js
          node --check src/product-flight.js
          node --check src/product-components.js
          node --check src/product-onlines.js
          python -m unittest discover -s tests -p expertise.py
          python -m unittest discover -s tests -p phone_stack.py
      - name: Generate and build portfolio
        run: npm run build
      - name: Verify shared footer runtime and built assets
        run: |
          node tests/footer-controls.cjs
          node tests/footer-static-parity.cjs
          test -f dist/footer-runtime.js
          test -f dist/footer-static.js
          grep -Fq -- '--wordmark-ink: #e3c3ff' dist/style.css
          grep -Fq 'footer-static.js' dist/index.html
          grep -Fq 'linear-gradient(120deg, #25074f' dist/style.css
      - name: Run expertise and SEO validations
        run: |
          python -m unittest discover -s tests -p expertise.py
          python tests/seo.py
          python tests/production.py
      - name: Install Chromium and WebKit for responsive QA
        run: npx playwright install --with-deps chromium webkit
      - name: Test mobile, iPad and desktop in Chromium
        run: |
          node tests/expertise-browser.cjs
          node tests/phone-stack-browser.cjs
          node tests/consumer-connect-real-browser.cjs
          node tests/product-onlines-browser.cjs
          node tests/product-onlines-visual.cjs
      - name: Test Safari-style layouts in WebKit
        run: |
          EXPERTISE_BROWSER_ENGINE=webkit node tests/expertise-browser.cjs
          EXPERTISE_BROWSER_ENGINE=webkit node tests/phone-stack-browser.cjs
          EXPERTISE_BROWSER_ENGINE=webkit node tests/consumer-connect-real-browser.cjs
          ONLINES_ENGINE=webkit node tests/product-onlines-browser.cjs
      - name: Upload review screenshots and test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expertise-portfolio-review
          path: |
            artifacts/expertise-qa/
            artifacts/product-flight/
            docs/product-brand-redesign-20261116/browser-*.json
            docs/component-refinement-20261116/components-*.json
            docs/component-refinement-20261116/screenshots/
            docs/onlines-fidelity-20261117/browser-*.json
            docs/onlines-fidelity-20261117/screenshots/local-*.png
          if-no-files-found: ignore

  canonical-next-export:
    name: P0-03D authenticated Next.js export
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/p0-03d-canonical-home-export-20261122' && github.base_ref == 'fix/p0-03a-home-static-bayfi-css-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact approved candidate (no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: '97544b9151eb9a19d51c5b0c757d7c065f232a7b'
          persist-credentials: false
      - name: Authenticate candidate revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "97544b9151eb9a19d51c5b0c757d7c065f232a7b"
          test -z "$(git status --porcelain)"
          echo "PASS: exact 40-character candidate commit checked out"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing build dependencies
        run: |
          set -euo pipefail
          python3 -m pip install pillow
          npm ci --no-audit --no-fund
      - name: Build canonical Next.js production-origin export
        env:
          SITE_URL: https://hadi.intellignce.net
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run build
          test "$(git rev-parse HEAD)" = "97544b9151eb9a19d51c5b0c757d7c065f232a7b"
      - name: Validate frontend assets and original motion bundles
        run: |
          set -euo pipefail
          python3 tests/export-hydration.py out
          python3 - <<'PY'
          from pathlib import Path
          import json, re, html
          root=Path('out')
          page=root/'index.html'
          assert page.is_file() and page.stat().st_size > 1000, 'Missing canonical homepage'
          markup=page.read_text(errors='replace')
          assert '/_next/static/' in markup, 'Missing Next.js client script references'
          assert 'id="site-content"' in markup or 'id=\"site-content\"' in markup, 'Missing Next.js page shell'
          static=root/'_next/static'
          js=sorted(static.rglob('*.js'))
          assert js, 'Next.js client JavaScript bundles missing'
          assert list(static.rglob('*.css')), 'Next.js CSS chunks missing'
          for name in ('style.css','hero.css','bayfi-port.css','bayfi-brand.css'):
              assert (root/name).is_file(), 'Missing stylesheet: '+name
          fonts=[p for p in (root/'assets').rglob('*') if p.suffix.lower() in ('.woff','.woff2','.ttf')]
          images=[p for p in (root/'assets').rglob('*') if p.suffix.lower() in ('.webp','.png','.jpg','.jpeg','.svg','.avif')]
          assert fonts, 'No exported fonts'
          assert images, 'No exported images'
          # The existing optimizer replaces approved hero sources with hashed responsive WebPs.
          # The existing prune-export step can then omit unused source files from out/.
          # Authenticate the responsive derivatives against the original tracked source bytes.
          import hashlib
          hero_verified={}
          for name in ('hero-stage.webp','hero-subject-enhanced.png'):
              original=Path('public/assets')/name
              assert original.is_file(), 'Approved hero source missing: '+name
              digest=hashlib.sha256(original.read_bytes()).hexdigest()[:12]
              variants=sorted((root/'assets/responsive').glob(digest+'-q90-*.webp'))
              targets=[root/'assets'/name]+variants
              referenced_targets=[p for p in targets if p.is_file() and ('/assets/'+p.relative_to(root/'assets').as_posix()) in markup]
              assert referenced_targets, 'Approved hero original or optimized image missing from export: '+name
              hero_verified[name]=[p.relative_to(root).as_posix() for p in referenced_targets]
          referenced=set(re.findall(r'(?:src|href|poster)="/assets/([^"?#]+)',markup))
          for relative in referenced:
              assert (root/'assets'/html.unescape(relative)).is_file(), 'Homepage asset missing: '+relative
          # Parse actual network-loading HTML tags, not escaped Next Flight JSON strings.
          from html.parser import HTMLParser
          class NextAssets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  url=attrs.get('src') if tag=='script' else attrs.get('href') if tag=='link' else None
                  if url and url.startswith('/_next/static/') and ('.js' in url or '.css' in url):
                      self.urls.append(url.split('?')[0])
          parser=NextAssets()
          parser.feed(markup)
          local_refs=sorted(set(parser.urls))
          assert local_refs, 'No Next.js script or stylesheet tags found'
          for local in local_refs:
              assert (root/local.lstrip('/')).is_file(), 'Next.js referenced bundle missing: '+local
          markers=('hadi-work','hadi-showreel','hadi-statement','hadi-practice')
          bundle_bytes=[(p,p.read_bytes()) for p in js]
          motion={}
          for marker in markers:
              matches=[p.relative_to(root).as_posix() for p,data in bundle_bytes if marker.encode() in data]
              assert matches, 'Original motion controller absent from client bundles: '+marker
              motion[marker]=matches
          Path('canonical-export-validation.json').write_text(json.dumps({
              'candidate_sha':'97544b9151eb9a19d51c5b0c757d7c065f232a7b',
              'next_js_chunks':len(js),'font_files':len(fonts),'image_files':len(images),
              'homepage_asset_references':len(referenced),'approved_hero_derivatives':hero_verified,'motion_controllers':motion,
              'checks':{'export_html':True,'bundle_references':True,'stylesheets':True,
                        'fonts':True,'images':True,'homepage_assets':True,'motion_bundles':True,
                        'hydration':True}
          },indent=2))
          print('PASS: authenticated Next.js files and original motion bundles')
          PY
      - name: High-confidence secret and private-file scan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,runpy,json
          root=Path('out')
          checker=runpy.run_path('scripts/package-hostinger.py')
          checker['assert_no_private_files'](root)
          patterns={
              'private-key-header':rb'-----BEGIN (?:RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----',
              'aws-access-key':rb'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b',
              'github-access-token':rb'(?:gh[pousr]_[A-Za-z0-9_]{36,}|github_pat_[A-Za-z0-9_]{50,})',
              'openai-secret-key':rb'sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{40,}',
              'stripe-live-secret':rb'sk_live_[A-Za-z0-9]{20,}',
              'slack-token':rb'xox[baprs]-[A-Za-z0-9-]{24,}'
          }
          extensions={'.html','.js','.mjs','.css','.map','.json','.xml','.txt','.svg','.md','.php','.env'}
          findings=[]
          scanned=0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions: continue
              scanned+=1
              content=path.read_bytes()
              for label,pattern in patterns.items():
                  if re.search(pattern,content):
                      findings.append({'file':path.relative_to(root).as_posix(),'rule':label})
          if findings:
              print('FAIL: detected high-confidence private material', json.dumps(findings))
              raise SystemExit(1)
          Path('canonical-export-security.json').write_text(json.dumps({
              'private_file_check':'PASS','high_confidence_secret_scan':'PASS',
              'text_files_scanned':scanned,'rules':list(patterns)},indent=2))
          print('PASS: no forbidden files or high-confidence tokens found')
          PY
      - name: Package validated frontend with existing secure packager
        run: |
          set -euo pipefail
          python3 scripts/package-hostinger.py "$PWD/canonical-next-export.zip"
      - name: Generate complete SHA-256 provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,json,subprocess,zipfile
          candidate='97544b9151eb9a19d51c5b0c757d7c065f232a7b'
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual==candidate
          root=Path('out')
          archive=Path('canonical-next-export.zip')
          def sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(1024*1024),b''):
                      h.update(block)
              return h.hexdigest()
          files=sorted([p for p in root.rglob('*') if p.is_file()])
          file_names=[p.relative_to(root).as_posix() for p in files]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'Corrupt export ZIP'
              members=z.namelist()
              assert len(members)==len(set(members)), 'Duplicate export ZIP entries'
              missing=set(file_names)-set(members)
              extra=set(members)-set(file_names)
              assert not missing and not extra, 'ZIP inventory mismatch: missing='+str(len(missing))+' extra='+str(len(extra))
          validation=json.loads(Path('canonical-export-validation.json').read_text())
          security=json.loads(Path('canonical-export-security.json').read_text())
          assert all(validation['checks'].values())
          assert security['high_confidence_secret_scan']=='PASS'
          manifest={
              'purpose':'P0-03D canonical Next.js homepage preview',
              'repository':'Sheikh-Hadi-Hassan/hadi-portfolio',
              'candidate_sha':candidate,
              'checkout_sha':actual,
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_url':'https://github.com/Sheikh-Hadi-Hassan/hadi-portfolio/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'source_unchanged':True,
              'build_command':'SITE_URL=https://hadi.intellignce.net npm run build',
              'export_root':'out/',
              'export_file_count':len(files),
              'export_files':[{'path':name,'size':p.stat().st_size,'sha256':sha256(p)}
                              for name,p in zip(file_names,files)],
              'export_zip':'canonical-next-export.zip',
              'export_zip_size':archive.stat().st_size,
              'export_zip_sha256':sha256(archive),
              'validation':validation,
              'security':security
          }
          Path('provenance.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('PASS: full export inventory and provenance recorded; files:',len(files))
          print('ZIP SHA-256:',manifest['export_zip_sha256'])
          PY
      - name: Upload authenticated export and provenance
        uses: actions/upload-artifact@v4
        with:
          name: p0-03d-canonical-next-export
          path: |
            canonical-next-export.zip
            provenance.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error


  canonical-home-browser:
    name: P0-03E authentic-export browser inspection
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/p0-03e-canonical-home-browser-20261123' && github.base_ref == 'fix/p0-03a-home-static-bayfi-css-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97544b9151eb9a19d51c5b0c757d7c065f232a7b
          persist-credentials: false
      - name: Download original export without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: p0-03d-canonical-next-export
          run-id: 45010820457
          repository: Sheikh-Hadi-Hassan/hadi-portfolio
          github-token: ${{ github.token }}
          path: p0-03e-input
      - name: Verify archive provenance and every exported file, then extract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 97544b9151eb9a19d51c5b0c757d7c065f232a7b
          python3 - <<'PY'
          import pathlib,json,hashlib,zipfile,stat
          root=pathlib.Path('p0-03e-input')
          assert sorted(x.name for x in root.iterdir())==['canonical-next-export.zip','provenance.json']
          m=json.loads((root/'provenance.json').read_text())
          assert m['candidate_sha']==m['checkout_sha']=='97544b9151eb9a19d51c5b0c757d7c065f232a7b'
          assert str(m['workflow_run_id'])=='45010820457'
          assert m['repository']=='Sheikh-Hadi-Hassan/hadi-portfolio' and m['source_unchanged'] is True
          assert all(m['validation']['checks'].values())
          assert m['security']['private_file_check']=='PASS'
          assert m['security']['high_confidence_secret_scan']=='PASS'
          archive=root/'canonical-next-export.zip'
          assert archive.stat().st_size==m['export_zip_size']
          def digest(f):
              h=hashlib.sha256()
              for block in iter(lambda:f.read(1048576),b''):h.update(block)
              return h.hexdigest()
          with archive.open('rb') as f: assert digest(f)==m['export_zip_sha256']=='096b83442580ba5338d66e2c4c0a3ef6e1e8b6c475dc05aa04393c884a9d7edd'
          expected={x['path']:x for x in m['export_files']}
          assert len(expected)==m['export_file_count']==2325
          dest=pathlib.Path('p0-03e-review/site')
          assert not dest.exists()
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist()
              assert z.testzip() is None and len(infos)==len(set(x.filename for x in infos))
              assert set(expected)==set(x.filename for x in infos)
              for x in infos:
                  p=pathlib.PurePosixPath(x.filename)
                  assert x.filename and not p.is_absolute() and not x.filename.startswith('/') and '\\' not in x.filename
                  assert all(y not in ('..','.','') for y in p.parts)
                  assert not x.is_dir() and not stat.S_ISLNK(x.external_attr>>16)
                  assert x.file_size==expected[x.filename]['size']
                  with z.open(x) as f: assert digest(f)==expected[x.filename]['sha256'],x.filename
              dest.mkdir(parents=True)
              for x in infos:
                  target=dest.joinpath(*pathlib.PurePosixPath(x.filename).parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(x) as src,target.open('xb') as out:
                      for chunk in iter(lambda:src.read(1048576),b''):out.write(chunk)
          assert (dest/'index.html').is_file() and list((dest/'_next/static').rglob('*.js'))
          pathlib.Path('p0-03e-qa').mkdir(exist_ok=True)
          pathlib.Path('p0-03e-qa/provenance.json').write_text(json.dumps({'candidate_sha':m['candidate_sha'],'source_run':m['workflow_run_id'],'inner_sha256':m['export_zip_sha256'],'file_count':len(expected),'security':m['security'],'build_performed':False},indent=2))
          print('PASS: authenticated 2325-file export extracted')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser testing dependencies without building
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: P0-03E2 targeted browser acceptance with measured states
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m http.server 8775 --bind 127.0.0.1 --directory p0-03e-review/site >/tmp/p0-03e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8775/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8775/
          cat > /tmp/p0-03e2-browser.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs'),path=require('path');
          const output='p0-03e-qa';
          fs.mkdirSync(output,{recursive:true});
          const origin='http://127.0.0.1:8775';
          const configs=[
            {name:'desktop',width:1440,height:900,motion:'no-preference'},
            {name:'tablet',width:768,height:1024,motion:'no-preference'},
            {name:'mobile',width:390,height:844,motion:'no-preference'},
            {name:'reduced-motion',width:1440,height:900,motion:'reduce'}
          ];
          const components=[
            ['Hero','.portfolio-hero','src/pages/home.html; src/styles/hero.css'],
            ['Showreel','.bf-reel','src/pages/home.html; homepage GSAP controller'],
            ['Manifesto','.bf-manifesto','src/pages/home.html; homepage GSAP controller'],
            ['Selected work','#work','src/pages/home.html; homepage GSAP controller'],
            ['Services','#services','src/pages/home.html; homepage service controller'],
            ['Experience folder','#practice','src/app/folder-motion.jsx; src/pages/home.html'],
            ['Digital products','#products','src/pages/home.html'],
            ['Digital collections','.digital-collection','src/pages/home.html'],
            ['Process','#process','src/pages/home.html'],
            ['Brand logos','#clients','src/pages/home.html'],
            ['Personal story','#story','src/pages/home.html'],
            ['Collaboration','#engagements','src/pages/home.html'],
            ['FAQ','#questions','src/pages/home.html'],
            ['Navigation','.menu-toggle','src/components/navigation.html; src/site.js'],
            ['Footer','footer','src/styles/footer.css; src/footer-runtime.js'],
            ['SERA entry','[data-sera-launch]','SERA launch controller'],
            ['Booking entry','[data-consultation-entry]','booking entry controller']
          ];
          const traceNames=[
            ['Showreel','.bf-reel','.bf-reel-stage','.bf-reel-frame'],
            ['Manifesto','.bf-manifesto','.bf-manifesto-percent','.bf-manifesto-line'],
            ['Selected work','#work','.v2sw-track','.v2sw-slide'],
            ['Experience folder','#practice','.fld-stage','.fld-card']
          ];
          const cleanURL=(raw)=>{
            try{const u=new URL(raw);return u.origin+u.pathname;}catch{return '[invalid URL]'}
          };
          function fileName(s){return s.toLowerCase().replace(/[^a-z0-9-]+/g,'-')}
          function addListeners(page){
            const errors=[],httpErrors=[],failed=[];
            page.on('pageerror',e=>errors.push({type:'exception',message:String(e.message).slice(0,400)}));
            page.on('console',m=>{if(m.type()==='error')errors.push({type:'console',message:m.text().slice(0,400).replace(/https?:\/\/[^\s"'<>]+/g,'[URL]')})});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({url:cleanURL(r.url()),status:r.status(),type:r.request().resourceType()})});
            page.on('requestfailed',r=>failed.push({url:cleanURL(r.url()),type:r.resourceType(),error:r.failure()?.errorText?.slice(0,100)}));
            return {errors,httpErrors,failed};
          }
          async function readiness(page,prefix){
            // Preserve the intentional loading state before waiting for the reveal.
            await page.screenshot({path:path.join(output,prefix+'-loading-'+page.viewportSize().width+'.png')});
            await page.evaluate(async()=>{await document.fonts.ready;await Promise.all([...document.querySelectorAll('.portfolio-hero img')].map(img=>img.decode?.().catch(()=>{})||Promise.resolve()))});
